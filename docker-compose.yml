services:
  respondr:
    image: ${RESPONDR_IMAGE:-ghcr.io/felixclements/respondr:latest}
    container_name: respondr
    ports:
      - "9595:9595"
    env_file:
      - path: .env
        required: false
    environment:
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    volumes:
      - ./data:/app/data
      - ./.wwebjs_auth:/app/.wwebjs_auth
    restart: unless-stopped
