services:
  respondr:
    build: .
    image: respondr:local
    container_name: respondr
    ports:
      # Same-host reverse proxy: use 127.0.0.1:9595:9595 (see README).
      - "9595:9595"
    env_file:
      - path: .env
        required: true
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DATA_DIR=/app/data
    volumes:
      - respondr_data:/app/data
      - respondr_wwebjs_auth:/app/.wwebjs_auth
    restart: unless-stopped
    # Single replica only: scan locks, scheduler, and rate limiters are DB/in-process
    # (see docs). Do not scale past 1 replica without a distributed lock.
    # Bind-mount alternative to named volumes:
    #   volumes:
    #     - ./data:/app/data
    #     - ./.wwebjs_auth:/app/.wwebjs_auth
    # If you bind-mount, ensure the host dirs are owned by uid 1000 (node):
    #   mkdir -p data .wwebjs_auth && sudo chown -R 1000:1000 data .wwebjs_auth
    # Or set `user: "1000:1000"` below. The entrypoint also chowns $DATA_DIR/$AUTH_DIR
    # at boot when starting as root, then drops to the node user.

volumes:
  respondr_data:
  respondr_wwebjs_auth:
