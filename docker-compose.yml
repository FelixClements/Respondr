services:
  respondr:
    build: .
    image: respondr:local
    container_name: respondr
    ports:
      # Same-host reverse proxy: use 127.0.0.1:9595:9595 (see README).
      - "9595:9595"
    env_file:
      - path: .env
        required: true
    environment:
      - NODE_ENV=production
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SETUP_TOKEN=${SETUP_TOKEN:-}
      - DATA_DIR=/app/data
    volumes:
      - respondr_data:/app/data
      - respondr_wwebjs_auth:/app/.wwebjs_auth
    restart: unless-stopped

volumes:
  respondr_data:
  respondr_wwebjs_auth:
